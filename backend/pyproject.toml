[project]
name = "mablop-backend"
version = "0.1.0"
description = "MABLOP Python Lambda backend"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "numpy>=1.26,<3",
]

# Flat layout: enumerate the top-level Lambda modules explicitly so setuptools
# does not fail on multi-top-level auto-discovery (deploy packaging + pip install -e).
[tool.setuptools]
py-modules = [
    "access_controller",
    "auth_crypto",
    "auth_log",
    "auth_messages",
    "auth_service",
    "auth_store",
    "auth_throttle",
    "bedrock",
    "checkpoint",
    "chunking",
    "crawler",
    "draft_history",
    "drafting_engine",
    "errors",
    "grant_service",
    "handler",
    "image_analyzer",
    "index_store",
    "legacy_migrator",
    "prompt_builder",
    "retrieval",
    "s3store",
    "style_learner",
    "style_profile",
    "user_scope",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "moto>=5,<6",
    "hypothesis>=6.100,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: property-based tests (Feature: mablop-mvp, Property N)",
]
